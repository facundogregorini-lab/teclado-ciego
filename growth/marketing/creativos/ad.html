<style>
*{box-sizing:border-box}body{margin:0;width:1080px;height:1350px;background:#1f3a31;color:#f3f6ef;font-family:"Liberation Sans",Arial,sans-serif;display:flex;flex-direction:column;padding:90px 84px;gap:44px}
